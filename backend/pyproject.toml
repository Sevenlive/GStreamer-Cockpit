[project]
name = "gstreamer-cockpit-backend"
version = "0.1.0"
description = "GStreamer virtual channel streaming and recording engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.92.0",
    "uvicorn[standard]>=0.17.6",
    "pydantic>=1.10.0",
    "Pillow>=9.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

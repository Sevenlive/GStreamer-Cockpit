services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
    environment:
      - COCKPIT_DATA_DIR=/app/data
      - COCKPIT_RECORDINGS_DIR=/app/recordings
      # Set COCKPIT_SIMULATION=1 to force simulation mode even when GStreamer is installed
      - COCKPIT_SIMULATION=0

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
